<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати місце</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e6f2ff;
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h3 class="text-center mb-4">Додати свій заклад</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Назва закладу</label>
                <input type="text" name="title" class="form-control" placeholder="Введіть назву" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Місце</label>
                <input type="text" name="location" class="form-control" placeholder="Де знаходиться?" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Коментар (за бажанням)</label>
                <textarea name="comment" class="form-control" placeholder="Ваш коментар..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Оцінка (1–5)</label>
                <input type="number" name="rating" class="form-control" min="1" max="5" step="0.5" placeholder="Введіть число">
            </div>
            <button type="submit" class="btn btn-primary w-100">Зберегти</button>
        </form>
    </div>
</body>
</html>
