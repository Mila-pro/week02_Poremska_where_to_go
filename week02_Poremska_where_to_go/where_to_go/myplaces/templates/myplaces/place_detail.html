{% extends "myplaces/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <img src="{% static 'myplaces/sticker.webp' %}" alt="Фото закладу"
             class="mb-3 mx-auto d-block"
             style="width:120px; height:120px; object-fit:cover; border-radius:8px;">

        <h3 class="text-center mb-3">{{ place.title }}</h3>

        <p><strong>Локація:</strong> {{ place.location|default:"Secret place 👀" }}</p>

        {% if place.comment %}
            <p><strong>Коментар:</strong> {{ place.comment }}</p>
        {% endif %}

        <p><strong>Рейтинг:</strong> ⭐ {{ place.rating }}</p>

        <a href="{% url 'myplaces:places_list' %}" class="btn btn-secondary mt-3">⬅ Назад до списку</a>
    </div>

</div>
{% endblock %}
