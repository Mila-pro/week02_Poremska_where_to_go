<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Where To Go{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #add8e6; 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex-grow: 1;
        }
        footer {
            background: white;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            padding: 10px;
        }

        .btn-main {
            background-color: #007bff;
            color: white;
            font-size: 1.2rem;
            padding: 10px 25px;
            border-radius: 30px;
            transition: 0.3s;
            margin-bottom: 20px;
            border: none;
        }
        .btn-main:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>

    {% include "myplaces/header.html" %}

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    {% include "myplaces/footer.html" %}

</body>
</html>
